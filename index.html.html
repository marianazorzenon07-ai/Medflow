<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MedFlow — Painel Acadêmico</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f0f2f5;--bg2:#e8eaed;--sur:#fff;--sur2:#f8f9fb;
  --bor:#e2e5eb;--tx:#1a1d23;--tx2:#5a6172;--tx3:#8a93a8;
  --ac:#2d6ef7;--ac2:#1a4fd4;--gn:#16a34a;--gnb:#f0fdf4;
  --yw:#ca8a04;--ywb:#fefce8;--rd:#dc2626;--rdb:#fef2f2;
  --pu:#7c3aed;--pub:#f5f3ff;--tl:#0d9488;--tlb:#f0fdfa;
  --r:14px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.07);
  --shl:0 8px 32px rgba(0,0,0,.12);--sw:252px;--tr:.18s ease;
}
[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--sur:#1c2333;--sur2:#242a3a;
  --bor:#2d3448;--tx:#e6e9f0;--tx2:#8892aa;--tx3:#5a6480;
  --ac:#4d85f8;--ac2:#3a6ee0;--gn:#22c55e;--gnb:#052e16;
  --yw:#eab308;--ywb:#1c1500;--rd:#ef4444;--rdb:#200000;
  --pu:#a78bfa;--pub:#1e1130;--tl:#2dd4bf;--tlb:#031a17;
  --sh:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.28);
  --shl:0 8px 32px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;overflow-x:hidden;transition:background var(--tr),color var(--tr)}

/* ─── SIDEBAR ─── */
.sidebar{width:var(--sw);min-height:100vh;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100;transition:transform var(--tr),background var(--tr);overflow-y:auto}
.sb-logo{padding:20px 18px 14px;border-bottom:1px solid var(--bor);flex-shrink:0}
.sb-logo-text{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ac);letter-spacing:-.5px}
.sb-logo-sub{font-size:10px;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase;margin-top:1px}
.sb-section{padding:8px 14px 2px;font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 14px;margin:1px 6px;border-radius:var(--rs);cursor:pointer;color:var(--tx2);font-size:13.5px;font-weight:500;transition:background var(--tr),color var(--tr);position:relative;user-select:none}
.sb-item:hover{background:var(--bg2);color:var(--tx)}
.sb-item.active{background:var(--ac);color:#fff}
.sb-item i{width:17px;text-align:center;font-size:13px;flex-shrink:0}
.sb-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:20px;text-align:center}
.sb-item.active .sb-badge{background:rgba(255,255,255,.3)}
.sb-bottom{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--bor);flex-shrink:0}

/* ─── MAIN ─── */
.main{margin-left:var(--sw);flex:1;min-height:100vh;display:flex;flex-direction:column;transition:margin var(--tr)}
.topbar{position:sticky;top:0;z-index:90;background:var(--sur);border-bottom:1px solid var(--bor);padding:13px 26px;display:flex;align-items:center;gap:12px;transition:background var(--tr)}
.topbar-title{font-family:'DM Serif Display',serif;font-size:19px;flex:1;color:var(--tx)}
.tb-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:35px;height:35px;border-radius:var(--rs);border:1px solid var(--bor);background:var(--sur2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2);font-size:14px;transition:all var(--tr)}
.icon-btn:hover{background:var(--bg2);color:var(--tx)}
.content{padding:22px 26px;flex:1}
.page-hint{font-size:12.5px;color:var(--tx3);margin-bottom:16px;padding:10px 14px;background:var(--sur2);border-radius:var(--rs);border:1px solid var(--bor)}

/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all var(--tr);white-space:nowrap;font-family:'DM Sans',sans-serif;text-decoration:none}
.btn-primary{background:var(--ac);color:#fff}
.btn-primary:hover{background:var(--ac2);box-shadow:0 4px 14px rgba(45,110,247,.3);transform:translateY(-1px)}
.btn-secondary{background:var(--sur2);color:var(--tx);border:1px solid var(--bor)}
.btn-secondary:hover{background:var(--bg2)}
.btn-danger{background:var(--rdb);color:var(--rd);border:1px solid var(--rd)}
.btn-danger:hover{background:var(--rd);color:#fff}
.btn-success{background:var(--gnb);color:var(--gn);border:1px solid var(--gn)}
.btn-success:hover{background:var(--gn);color:#fff}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}

/* ─── CARDS ─── */
.card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bor);box-shadow:var(--sh);transition:background var(--tr),border-color var(--tr)}

/* ─── GRID ─── */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.ga{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}

/* ─── STAT CARD ─── */
.stat-card{padding:18px;display:flex;align-items:flex-start;gap:12px}
.stat-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.stat-num{font-family:'DM Serif Display',serif;font-size:27px;line-height:1;color:var(--tx)}
.stat-lbl{font-size:12px;color:var(--tx2);margin-top:2px}

/* ─── BADGE ─── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em}
.b-blue{background:#eff4ff;color:var(--ac)}
.b-green{background:var(--gnb);color:var(--gn)}
.b-yellow{background:var(--ywb);color:var(--yw)}
.b-red{background:var(--rdb);color:var(--rd)}
.b-purple{background:var(--pub);color:var(--pu)}
.b-teal{background:var(--tlb);color:var(--tl)}
.b-gray{background:var(--bg2);color:var(--tx2)}

/* ─── PROGRESS ─── */
.pbar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.pfill{height:100%;border-radius:3px;background:var(--ac);transition:width .5s ease}
.pfill-gn{background:var(--gn)}
.pfill-yw{background:var(--yw)}
.pfill-rd{background:var(--rd)}
.pfill-pu{background:var(--pu)}

/* ─── FORMS ─── */
.fg{margin-bottom:13px}
.fl{display:block;font-size:11.5px;font-weight:600;color:var(--tx2);margin-bottom:4px;letter-spacing:.02em}
.fc{width:100%;padding:8px 12px;border-radius:var(--rs);border:1px solid var(--bor);background:var(--sur2);color:var(--tx);font-size:13px;font-family:'DM Sans',sans-serif;transition:border-color var(--tr),background var(--tr);outline:none}
.fc:focus{border-color:var(--ac);background:var(--sur)}
textarea.fc{resize:vertical;min-height:75px}
select.fc{cursor:pointer}

/* ─── MODAL ─── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity var(--tr);padding:14px}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--sur);border-radius:var(--r);box-shadow:var(--shl);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;transform:translateY(18px);transition:transform var(--tr)}
.modal-bg.open .modal{transform:translateY(0)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--bor);position:sticky;top:0;background:var(--sur);z-index:1}
.modal-ttl{font-family:'DM Serif Display',serif;font-size:17px}
.modal-bd{padding:18px 22px}
.modal-ft{padding:14px 22px;border-top:1px solid var(--bor);display:flex;gap:8px;justify-content:flex-end}

/* ─── FILTER BAR ─── */
.fbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--bor);background:var(--sur2);font-size:11.5px;cursor:pointer;transition:all var(--tr);color:var(--tx2)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}

/* ─── LIST ITEM ─── */
.li{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--bor)}
.li:last-child{border-bottom:none}
.dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}

/* ─── AULA CARD ─── */
.aula-card{padding:13px 15px;border-left:4px solid var(--ac);background:var(--sur);border-radius:0 var(--rs) var(--rs) 0;margin-bottom:7px;box-shadow:var(--sh)}
.aula-card.s-assistida{border-left-color:var(--gn)}
.aula-card.s-precisa-revisar{border-left-color:var(--yw)}
.aula-card.s-revisada{border-left-color:var(--tl)}
.aula-card.s-nao-assistida{border-left-color:var(--bor);opacity:.8}
.aula-ttl{font-size:13.5px;font-weight:600;margin-bottom:3px}
.aula-meta{font-size:11.5px;color:var(--tx2);display:flex;gap:10px;flex-wrap:wrap}

/* ─── RISK ─── */
.risk-card{padding:18px;overflow:hidden;position:relative}
.risk-lvl{font-family:'DM Serif Display',serif;font-size:30px;margin:3px 0}
.rbar{height:5px;border-radius:3px;background:var(--bg2);margin-top:12px}
.rfill{height:100%;border-radius:3px;transition:width .5s ease}
.risk-t .rfill{background:var(--gn)}
.risk-a .rfill{background:var(--yw)}
.risk-u .rfill{background:var(--rd)}

/* ─── REVISAO ─── */
.rev-card{padding:11px 14px;margin-bottom:7px;display:flex;align-items:center;gap:11px}
.rev-ciclo{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}

/* ─── CHECK ITEM ─── */
.ck-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--rs);background:var(--sur2);margin-bottom:5px;cursor:pointer;transition:background var(--tr)}
.ck-item:hover{background:var(--bg2)}
.ck-item.done{opacity:.55}
.ck-item.done .ck-lbl{text-decoration:line-through;color:var(--tx3)}
.ck-box{width:17px;height:17px;border-radius:4px;border:2px solid var(--bor);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
.ck-item.done .ck-box{background:var(--gn);border-color:var(--gn)}
.ck-lbl{font-size:13px;flex:1}

/* ─── NOTA CARD ─── */
.nota-card{padding:13px 15px;margin-bottom:8px}
.nota-prev{font-size:12px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-badge{font-size:10px;background:var(--ywb);color:var(--yw);padding:2px 6px;border-radius:10px;font-weight:600}

/* ─── SEARCH ─── */
.srch{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--bor);border-radius:var(--rs);background:var(--sur2);max-width:280px}
.srch input{border:none;background:transparent;outline:none;font-size:13px;color:var(--tx);flex:1;font-family:inherit}
.srch i{color:var(--tx3);font-size:12px}

/* ─── CHART ─── */
.chart-wrap{position:relative;height:195px}

/* ─── DAY LABEL ─── */
.day-lbl{font-size:10.5px;font-weight:700;color:var(--tx3);letter-spacing:.07em;text-transform:uppercase;margin:14px 0 7px}

/* ─── CLASSROOM STATUS ─── */
.cls-status{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--rs);background:var(--bg2);font-size:13px;margin-bottom:14px}
.st-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-dot.on{background:var(--gn);box-shadow:0 0 0 3px var(--gnb)}
.st-dot.off{background:var(--tx3)}

/* ─── CODE ─── */
code{font-family:monospace;font-size:11.5px;background:var(--bg2);padding:1px 5px;border-radius:3px;color:var(--tx2)}

/* ─── MOBILE ─── */
.ham{display:none}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.sb-overlay.open{display:block}

@media(max-width:800px){
  :root{--sw:0px}
  .sidebar{transform:translateX(-252px);width:252px;box-shadow:var(--shl)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .ham{display:flex}
  .content{padding:14px}
  .topbar{padding:11px 14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .ga{grid-template-columns:1fr}
}

@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .2s ease}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 2s infinite}
.nota-editor{width:100%;min-height:110px;padding:9px 12px;border:1px solid var(--bor);border-radius:var(--rs);background:var(--sur2);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;resize:vertical;outline:none;transition:border-color var(--tr)}
.nota-editor:focus{border-color:var(--ac)}
.mat-card{padding:0;overflow:hidden}
.mat-stripe{height:5px}
.mat-body{padding:14px 16px}
.countdown{font-family:'DM Serif Display',serif;font-size:34px;color:var(--ac);line-height:1}
</style>
</head>

// FUNÇÕES OBRIGATÓRIAS — NORMALIZAÇÃO E DEDUPLICAÇÃO
// ═══════════════════════════════════════════════════════════════
function normalizarTituloAula(t){
  if(!t) return '';
  return t
    .replace(/[-–—]?\s*(turma[s]?\s+[a-z0-9]+(\s+e\s+[a-z0-9]+)?)/gi,'')
    .replace(/[-–—]?\s*(grupo[s]?\s+[a-z0-9]+(\s+e\s+[a-z0-9]+)?)/gi,'')
    .replace(/[-–—]?\s*(sala\s+[a-z0-9]+)/gi,'')
    .replace(/[-–—]?\s*(prof\.?\s+\w+(\s+\w+)?)/gi,'')
    .replace(/[-–—]?\s*(profa?\.?\s+\w+(\s+\w+)?)/gi,'')
    .replace(/\s*\(turma\s+[^)]+\)/gi,'')
    .replace(/\s*\(grupo\s+[^)]+\)/gi,'')
    .replace(/\bteo:\s*/gi,'').replace(/\bprat:\s*/gi,'')
    .replace(/[-–—,;:]+\s*$/,'').replace(/\s+/g,' ').trim().toLowerCase();
}
function normalizarTituloMaterial(t){
  if(!t) return '';
  return t
    .replace(/[-–—]?\s*(turma[s]?\s+[a-z0-9]+)/gi,'')
    .replace(/[-–—]?\s*(grupo[s]?\s+[a-z0-9]+)/gi,'')
    .replace(/[-–—]?\s*(sala\s+[a-z0-9]+)/gi,'')
    .replace(/\s+/g,' ').trim().toLowerCase();
}
function removerAulasDuplicadas(lista){
  const seen=new Map(), out=[];
  for(const a of lista){
    const k=`${a.tituloNormalizado||normalizarTituloAula(a.titulo)}|${a.data}|${a.materia||''}`;
    if(!seen.has(k)){seen.set(k,true);out.push(a);}
  }
  return out;
}
function removerMateriaisDuplicados(lista){
  const seen=new Map(), out=[];
  for(const m of lista){
    const k=`${m.tituloNormalizado||normalizarTituloMaterial(m.titulo)}|${m.materia||''}|${m.link||''}`;
    if(!seen.has(k)){seen.set(k,true);out.push(m);}
  }
  return out;
}

function vincularMaterialComProva(mId,pId){const m=DB.materiais.find(x=>x.id===mId);if(m){m.provaId=pId;saveDB();}}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date();
function diasAte(d){if(!d)return null;return Math.ceil((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);}
function fmtD(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function fmtH(s){return s?s.slice(0,5):'—';}
function diaSem(s){if(!s)return'';return['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(s+'T00:00:00').getDay()];}
function greet(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// ═══════════════════════════════════════════════════════════════
// RISCO ACADÊMICO
// ═══════════════════════════════════════════════════════════════
function calcRisco(){
  let sc=0;
  DB.provas.filter(p=>{const d=diasAte(p.data);return d!==null&&d>=0&&d<=7&&p.status!=='realizada';}).forEach(()=>sc+=22);
  DB.tarefas.filter(t=>t.prazo&&t.prazo<today()&&t.status!=='concluida').forEach(()=>sc+=15);
  DB.revisoes.filter(r=>r.dataRevisao<today()&&r.status==='pendente').forEach(()=>sc+=10);
  DB.materiais.filter(m=>m.prazoLeitura&&m.prazoLeitura<today()&&m.statusLeitura!=='lido').forEach(()=>sc+=7);
  const pct=Math.min(sc,100);
  if(pct<30)return{n:'Tranquilo',pct,cls:'risk-t',ic:'fa-circle-check',cor:'var(--gn)'};
  if(pct<65)return{n:'Atenção',pct,cls:'risk-a',ic:'fa-triangle-exclamation',cor:'var(--yw)'};
  return{n:'Urgente',pct,cls:'risk-u',ic:'fa-circle-exclamation',cor:'var(--rd)'};
}

  if(pg==='desempenho')setTimeout(initCharts,80);
}
function render(pg){
  const fn={home:pHome,rotina:pRotina,aulas:pAulas,provas:pProvas,plano:pPlano,revisoes:pRevisoes,tarefas:pTarefas,materias:pMaterias,biblioteca:pBiblioteca,desempenho:pDesempenho,anotacoes:pAnotacoes,classroom:pClassroom};
  return(fn[pg]||function(){return'<p>Página não encontrada.</p>';})();
}

function setAF(tipo,v){if(tipo==='s')afS=v;else afM=v;go('aulas');}
function setAS(id,s){
  const a=DB.aulas.find(x=>x.id===id);
  if(!a)return;
  // Toggle: se já está no status solicitado, voltar para nao-assistida
  if(a.status===s){
    a.status='nao-assistida';
  } else {
    a.status=s;
    if(s==='assistida') scheduleRev(a);
  }
  saveDB();
  go(CUR);
}
function toggleAulaAssistida(id){setAS(id,'assistida');}
function toggleAulaPrecisaRevisar(id){setAS(id,'precisa-revisar');}

    <div class="fg"><label class="fl">Início</label><input type="time" class="fc" id="fa-hi" value="${a?.horarioInicio||''}"></div>
    <div class="fg"><label class="fl">Fim</label><input type="time" class="fc" id="fa-hf" value="${a?.horarioFim||''}"></div>
    <div class="fg"><label class="fl">Tipo</label><select class="fc" id="fa-tp">${['Teórica','Prática','Tutoria','Seminário','Estágio','Outro'].map(t=>`<option ${a?.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">Status</label><select class="fc" id="fa-s">${['nao-assistida','assistida','precisa-revisar','revisada'].map(s=>`<option value="${s}" ${a?.status===s?'selected':''}>${sLbl(s)}</option>`).join('')}</select></div>
    <div class="fg" style="grid-column:1/-1"><label class="fl">Observações</label><textarea class="fc" id="fa-o">${esc(a?.observacoes||'')}</textarea></div>
  </div>`;
  openModal(a?'Editar Aula':'Nova Aula',b,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAula('${id||''}')">Salvar</button>`);
}
function saveAula(id){
  const t=document.getElementById('fa-t').value.trim(),d=document.getElementById('fa-d').value;
  if(!t||!d){alert('Título e data são obrigatórios');return;}
  const obj={id:id||uid(),titulo:t,tituloNormalizado:normalizarTituloAula(t),data:d,materia:document.getElementById('fa-m').value.trim(),modulo:document.getElementById('fa-mo').value.trim(),professor:document.getElementById('fa-p').value.trim(),horarioInicio:document.getElementById('fa-hi').value,horarioFim:document.getElementById('fa-hf').value,tipo:document.getElementById('fa-tp').value,status:document.getElementById('fa-s').value,observacoes:document.getElementById('fa-o').value.trim()};
  if(id){const i=DB.aulas.findIndex(a=>a.id===id);if(i>=0)DB.aulas[i]=obj;}else DB.aulas.push(obj);
  saveDB();closeModal();go('aulas');
}

// REVISÕES ESPAÇADAS
// ═══════════════════════════════════════════════════════════════
function scheduleRev(aula){
  [1,7,15,30].forEach(dias=>{
    const dt=new Date(aula.data+'T00:00:00');dt.setDate(dt.getDate()+dias);
    if(!DB.revisoes.find(r=>r.aulaId===aula.id&&r.ciclo===dias))
      DB.revisoes.push({id:uid(),aulaId:aula.id,dataRevisao:dt.toISOString().slice(0,10),ciclo:dias,status:'pendente'});
  });
}
function doneRev(id){
  const r=DB.revisoes.find(x=>x.id===id);
  if(!r)return;
  // Toggle: concluida ↔ pendente
  r.status = r.status==='concluida' ? 'pendente' : 'concluida';
  saveDB();
  go(CUR);
}
function toggleRevisao(id){doneRev(id);}

function setPS(id,s){const p=DB.provas.find(x=>x.id===id);if(p){p.status=s;saveDB();}}
function delProva(id){if(!confirm('Excluir?'))return;DB.provas=DB.provas.filter(p=>p.id!==id);saveDB();go('provas');}

function saveProva(id){

}

function setTF(f){tfil=f;go('tarefas');}

function pRevisoes(){
  const t=today();
  const pend=DB.revisoes.filter(r=>r.status==='pendente').sort((a,b)=>a.dataRevisao.localeCompare(b.dataRevisao));
  const hj=pend.filter(r=>r.dataRevisao<=t);
  const fut=pend.filter(r=>r.dataRevisao>t);
  const conc=DB.revisoes.filter(r=>r.status==='concluida').length;
  const rCard=r=>{const a=DB.aulas.find(x=>x.id===r.aulaId),atr=r.dataRevisao<t,concl=r.status==='concluida';return`<div class="card rev-card" style="opacity:${concl?.65:1}"><div class="rev-ciclo" style="${atr&&!concl?'background:var(--rd)':concl?'background:var(--gn)':''}">${r.ciclo}d</div><div style="flex:1"><div style="font-size:13.5px;font-weight:600;${concl?'text-decoration:line-through;color:var(--tx3)':''}">${a?esc(a.titulo):'Aula removida'}</div><div style="font-size:11.5px;color:var(--tx2)">${a?esc(a.materia||'—'):'—'} · ${fmtD(r.dataRevisao)} ${atr&&!concl?'<span style="color:var(--rd);font-weight:600">⚠ Atrasada</span>':concl?'<span style="color:var(--gn);font-weight:600">✓ Concluída</span>':''}</div></div><button class="btn btn-sm ${concl?'btn-secondary':'btn-success'}" onclick="doneRev('${r.id}')">${concl?'↺ Reabrir':'✓ Concluir'}</button></div>`;};
  return`
  <div class="page-hint">Ao marcar uma aula como assistida, revisões são agendadas automaticamente em 1, 7, 15 e 30 dias.</div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card stat-card"><div class="stat-icon" style="background:var(--rdb);color:var(--rd)"><i class="fa-solid fa-clock"></i></div><div><div class="stat-num">${hj.length}</div><div class="stat-lbl">Para hoje</div></div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:#eff4ff;color:var(--ac)"><i class="fa-solid fa-calendar-days"></i></div><div><div class="stat-num">${fut.length}</div><div class="stat-lbl">Agendadas</div></div></div>
    <div class="card stat-card"><div class="stat-icon" style="background:var(--gnb);color:var(--gn)"><i class="fa-solid fa-circle-check"></i></div><div><div class="stat-num">${conc}</div><div class="stat-lbl">Concluídas</div></div></div>
  </div>
  <div class="day-lbl">Para Hoje / Atrasadas</div>
  ${hj.length===0?`<div class="card" style="padding:22px;text-align:center;color:var(--tx3)"><i class="fa-solid fa-circle-check" style="font-size:28px;margin-bottom:8px;display:block;color:var(--gn)"></i>Nenhuma revisão pendente para hoje!</div>`:hj.map(rCard).join('')}
  ${fut.length>0?`<div class="day-lbl" style="margin-top:14px">Próximas Revisões</div>${fut.slice(0,10).map(rCard).join('')}`:''}
  ${conc>0?`<div class="day-lbl" style="margin-top:14px">Concluídas — clique em "↺ Reabrir" para desfazer</div>${DB.revisoes.filter(r=>r.status==='concluida').slice(0,5).map(rCard).join('')}`:''}
\`;
}

function pPlano(){
  const itens=DB.plano.sort((a,b)=>({urgente:0,alta:1,media:2,baixa:3}[a.prioridade]||3)-({urgente:0,alta:1,media:2,baixa:3}[b.prioridade]||3));
  const conc=itens.filter(i=>i.status==='concluido').length;
  const pct=itens.length>0?Math.round((conc/itens.length)*100):0;
  const sugerida=DB.provas.filter(p=>diasAte(p.data)>=0).sort((a,b)=>a.data.localeCompare(b.data))[0]?.materia||'';
  return`
  <div class="page-hint">Organize o que você precisa estudar esta semana. A prioridade é sugerida automaticamente com base nas provas próximas.</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="font-size:13px;color:var(--tx2)">${conc}/${itens.length} concluídos esta semana</div>
    <button class="btn btn-primary" onclick="mPlano()"><i class="fa-solid fa-plus"></i> Adicionar Estudo</button>
  </div>
  <div class="card" style="padding:14px 16px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span style="font-weight:600">Progresso da semana</span><span style="color:var(--ac);font-weight:700">${pct}%</span></div>
    <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
  </div>
  ${itens.length===0?`<div class="card" style="padding:32px;text-align:center;color:var(--tx3)"><i class="fa-solid fa-calendar-check" style="font-size:36px;margin-bottom:10px;display:block"></i><p>Nenhum estudo planejado.</p></div>`:''}
  ${itens.map(it=>`
  <div class="card" style="padding:12px 14px;margin-bottom:7px;opacity:${it.status==='concluido'?.55:1}">
    <div style="display:flex;align-items:center;gap:9px">
      <input type="checkbox" style="width:15px;height:15px;cursor:pointer;accent-color:var(--gn);flex-shrink:0" ${it.status==='concluido'?'checked':''} onchange="togglePl('${it.id}')">
      <div style="flex:1">
        <div style="font-size:13.5px;font-weight:600;${it.status==='concluido'?'text-decoration:line-through;color:var(--tx3)':''}">${esc(it.materia)}</div>
        <div style="font-size:11px;color:var(--tx2)">${esc(it.topico||'—')} · ${it.tempo?it.tempo+' min estimados':'—'}</div>
      </div>
      <span class="badge ${pBadge(it.prioridade)}">${it.prioridade||'—'}</span>
      <button class="btn btn-xs btn-danger" onclick="delPl('${it.id}')"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>`).join('')}`;
}
function togglePl(id){const i=DB.plano.find(x=>x.id===id);if(i){i.status=i.status==='concluido'?'pendente':'concluido';saveDB();go('plano');}}
function delPl(id){DB.plano=DB.plano.filter(x=>x.id!==id);saveDB();go('plano');}
function mPlano(){
  const sug=DB.provas.filter(p=>diasAte(p.data)>=0).sort((a,b)=>a.data.localeCompare(b.data))[0]?.materia||'';
  const mats=[...new Set(DB.materias.map(m=>m.nome))];
  const b=`
    <div class="fg"><label class="fl">Matéria *</label><input class="fc" id="fpl-m" value="${esc(sug)}" list="dl-pm"><datalist id="dl-pm">${mats.map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div>
    <div class="fg"><label class="fl">Tópico / Assunto</label><input class="fc" id="fpl-t" placeholder="Ex: Revisão dos slides, capítulo 5..."></div>
    <div class="grid g2">
      <div class="fg"><label class="fl">Tempo estimado (min)</label><input type="number" class="fc" id="fpl-tmp" placeholder="Ex: 90"></div>
      <div class="fg"><label class="fl">Prioridade</label><select class="fc" id="fpl-p">${['baixa','media','alta','urgente'].map(p=>`<option>${p}</option>`).join('')}</select></div>
    </div>
    ${sug?`<div style="font-size:12px;color:var(--ac);background:#eff4ff;padding:8px 10px;border-radius:var(--rs);margin-top:4px">💡 Sugestão: <strong>${esc(sug)}</strong> tem prova próxima!</div>`:''}`;
  openModal('Adicionar Estudo',b,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="savePl()">Adicionar</button>`);
}
function savePl(){
  const m=document.getElementById('fpl-m').value.trim();if(!m)return;
  DB.plano.push({id:uid(),materia:m,topico:document.getElementById('fpl-t').value.trim(),tempo:document.getElementById('fpl-tmp').value,prioridade:document.getElementById('fpl-p').value,status:'pendente'});
  saveDB();closeModal();go('plano');
}

function pMaterias(){
  const mSet=new Set([...DB.materias.map(m=>m.nome),...DB.aulas.map(a=>a.materia).filter(Boolean)]);
  const lista=[...mSet].sort();
  const cores=['var(--ac)','var(--tl)','var(--pu)','var(--gn)','var(--yw)','var(--rd)'];
  return`
  <div class="page-hint">Veja o progresso em cada matéria. As matérias são criadas automaticamente quando você adiciona aulas.</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="font-size:13px;color:var(--tx2)">${lista.length} matérias</div>
    <button class="btn btn-primary" onclick="mMateria()"><i class="fa-solid fa-plus"></i> Nova Matéria</button>
  </div>
  ${lista.length===0?`<div class="card" style="padding:32px;text-align:center;color:var(--tx3)"><i class="fa-solid fa-book" style="font-size:36px;margin-bottom:10px;display:block"></i><p>Adicione aulas para ver as matérias aqui.</p></div>`:''}
  <div class="grid ga">
    ${lista.map((nome,i)=>{
      const am=DB.aulas.filter(a=>a.materia===nome);
      const as=am.filter(a=>a.status==='assistida'||a.status==='revisada').length;
      const pct=am.length>0?Math.round((as/am.length)*100):0;
      const cor=cores[i%cores.length];
      const rv=DB.revisoes.filter(r=>{const a=DB.aulas.find(x=>x.id===r.aulaId);return a&&a.materia===nome&&r.status==='pendente';}).length;
      return`<div class="card mat-card">
        <div class="mat-stripe" style="background:${cor}"></div>
        <div class="mat-body">
          <div style="font-size:15px;font-weight:700;margin-bottom:10px">${esc(nome)}</div>
          <div class="grid g2" style="gap:6px;margin-bottom:11px">
            ${[['Aulas',am.length,'fa-chalkboard'],['Assistidas',as,'fa-check'],['Provas',DB.provas.filter(p=>p.materia===nome).length,'fa-file-pen'],['Tarefas',DB.tarefas.filter(t=>t.materia===nome&&t.status!=='concluida').length,'fa-list-check'],['Revisões',rv,'fa-rotate'],['Materiais',DB.materiais.filter(m=>m.materia===nome).length,'fa-layer-group']].map(([l,n,ic])=>`<div style="font-size:11.5px;color:var(--tx2)"><i class="fa-solid ${ic}" style="width:13px;opacity:.5"></i> ${l}: <strong style="color:var(--tx)">${n}</strong></div>`).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span>Progresso</span><span style="font-weight:700;color:${cor}">${pct}%</span></div>
          <div class="pbar"><div class="pfill" style="width:${pct}%;background:${cor}"></div></div>
        </div>
      </div>`;}).join('')}
  </div>`;
}
function mMateria(){
  openModal('Nova Matéria',`<div class="fg"><label class="fl">Nome *</label><input class="fc" id="fm-n" placeholder="Ex: Fisiologia Humana"></div><div class="fg"><label class="fl">Descrição</label><textarea class="fc" id="fm-d"></textarea></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveMateria()">Salvar</button>`);

let bfil={s:'todos',m:'todas',q:''};
function pBiblioteca(){
  const mats=[...new Set(DB.materiais.map(m=>m.materia).filter(Boolean))];

    <div style="font-size:13px;color:var(--tx2)">${fil.length} materiais</div>

    ${['todos','nao-lido','lendo','lido','revisar'].map(s=>`<div class="chip ${bfil.s===s?'on':''}" onclick="setBF('s','${s}')">${s.replace(/-/g,' ')}</div>`).join('')}
    <div class="chip ${bfil.m==='todas'?'on':''}" onclick="setBF('m','todas')">Todas</div>

  fil.map(m=>`

      <div style="font-size:21px;margin-top:1px"><i class="fa-solid ${tIcon(m.tipo)}" style="color:${({PDF:'var(--rd)',vídeo:'var(--pu)',link:'var(--ac)',slide:'var(--tl)',artigo:'var(--gn)',livro:'var(--yw)'}[m.tipo]||'var(--tx2)')}"></i></div>
      <div style="flex:1">
        <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:3px">
          <span style="font-size:13.5px;font-weight:600">${esc(m.titulo)}</span>
          <span class="badge ${pBadge(m.prioridade)}">${m.prioridade||'—'}</span>
        </div>
        <div style="font-size:11.5px;color:var(--tx2);display:flex;gap:10px;flex-wrap:wrap">
          ${m.materia?`<span>📚 ${esc(m.materia)}</span>`:''}${m.tipo?`<span>📄 ${esc(m.tipo)}</span>`:''}${m.prazoLeitura?`<span>⏰ ${fmtD(m.prazoLeitura)}</span>`:''}${m.tags?`<span>🏷 ${esc(m.tags)}</span>`:''}
        </div>
        ${m.link?`<a href="${esc(m.link)}" target="_blank" rel="noopener" style="font-size:12px;color:var(--ac);margin-top:3px;display:inline-block">Abrir link →</a>`:''}

      <div style="display:flex;gap:5px;flex-direction:column;align-items:flex-end;flex-shrink:0">
        <select class="fc" style="width:auto;font-size:11px;padding:3px 6px" onchange="setMS('${m.id}',this.value)">
          ${['nao-lido','lendo','lido','revisar'].map(s=>`<option value="${s}" ${m.statusLeitura===s?'selected':''}>${s.replace(/-/g,' ')}</option>`).join('')}
        </select>

function setBF(tipo,v){bfil[tipo]=v;go('biblioteca');}

function saveMat(id){
  const t=document.getElementById('fmm-t').value.trim();if(!t)return;
  const obj={id:id||uid(),titulo:t,tituloNormalizado:normalizarTituloMaterial(t),materia:document.getElementById('fmm-m').value.trim(),modulo:document.getElementById('fmm-mo').value.trim(),tipo:document.getElementById('fmm-tp').value,origem:document.getElementById('fmm-or').value,prioridade:document.getElementById('fmm-p').value,statusLeitura:document.getElementById('fmm-s').value,link:document.getElementById('fmm-l').value.trim(),prazoLeitura:document.getElementById('fmm-pz').value,tags:document.getElementById('fmm-tg').value.trim(),observacoes:document.getElementById('fmm-ob').value.trim(),dataImportacao:today()};

}

function pDesempenho(){
  const notas=DB.provas.filter(p=>p.nota);
  const media=notas.length>0?(notas.reduce((s,p)=>s+parseFloat(p.nota||0),0)/notas.length).toFixed(1):'—';

  <div class="page-hint">Acompanhe seu progresso acadêmico com gráficos e estatísticas.</div>

    <div class="card" style="padding:16px 18px">
      <div style="font-size:13px;font-weight:600;margin-bottom:13px">Progresso por Matéria</div>
      <div class="chart-wrap"><canvas id="cMat"></canvas></div>
    </div>
    <div class="card" style="padding:16px 18px">
      <div style="font-size:13px;font-weight:600;margin-bottom:13px">Notas das Provas</div>
      <div class="chart-wrap"><canvas id="cProvas"></canvas></div>
    </div>
  </div>
  <div class="card" style="padding:16px 18px">
    <div style="font-size:13px;font-weight:600;margin-bottom:13px">Progresso por Matéria (detalhado)</div>
    ${[...new Set(DB.aulas.map(a=>a.materia).filter(Boolean))].map(m=>{
      const am=DB.aulas.filter(a=>a.materia===m);
      const as=am.filter(a=>a.status==='assistida'||a.status==='revisada').length;
      const pct=am.length>0?Math.round((as/am.length)*100):0;
      const cor=pct<40?'var(--rd)':pct<70?'var(--yw)':'var(--gn)';
      return`<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${esc(m)}</span><span style="font-weight:700;color:${cor}">${pct}%</span></div><div class="pbar"><div class="pfill" style="width:${pct}%;background:${cor}"></div></div></div>`;
    }).join('')||'<div style="color:var(--tx3);font-size:13px">Adicione aulas para ver o progresso por matéria.</div>'}
  </div>`;

function initCharts(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const tc=dark?'#8892aa':'#5a6172';

  const cMat=document.getElementById('cMat');
  if(cMat){
    const mats=[...new Set(DB.aulas.map(a=>a.materia).filter(Boolean))].slice(0,6);
    const dados=mats.map(m=>{const t=DB.aulas.filter(a=>a.materia===m).length,a=DB.aulas.filter(a=>a.materia===m&&(a.status==='assistida'||a.status==='revisada')).length;return t>0?Math.round((a/t)*100):0;});
    if(window._cMat)window._cMat.destroy();
    window._cMat=new Chart(cMat,{type:'bar',data:{labels:mats,datasets:[{label:'Progresso (%)',data:dados,backgroundColor:'rgba(45,110,247,.7)',borderColor:'#2d6ef7',borderWidth:2,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{max:100,ticks:{color:tc}},x:{ticks:{color:tc}}}}});
  }
  const cPr=document.getElementById('cProvas');
  if(cPr){
    const pn=DB.provas.filter(p=>p.nota);
    if(window._cPr)window._cPr.destroy();
    window._cPr=new Chart(cPr,{type:'line',data:{labels:pn.map(p=>p.materia||p.titulo),datasets:[{label:'Nota',data:pn.map(p=>parseFloat(p.nota||0)),borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.15)',tension:.4,fill:true,pointRadius:5,pointBackgroundColor:'#16a34a'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:10,ticks:{color:tc}},x:{ticks:{color:tc}}}}});
  }
}

// ─── ROTINA ─────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════
function pRotina(){
  const t=today();
  const ah=DB.aulas.filter(a=>a.data===t).sort((a,b)=>(a.horarioInicio||'').localeCompare(b.horarioInicio||''));
  const rh=DB.revisoes.filter(r=>r.dataRevisao<=t&&r.status==='pendente');
  const tu=DB.tarefas.filter(t2=>t2.status!=='concluida'&&(t2.prioridade==='urgente'||t2.prioridade==='alta'));
  const mh=DB.materiais.filter(m=>m.prazoLeitura<=t&&m.statusLeitura!=='lido');
  const ph=DB.plano.filter(p=>p.status!=='concluido');

  const itens=[
    ...ah.map(a=>({id:'a-'+a.id,lbl:`Aula: ${a.titulo}`,tp:'aula',done:a.status==='assistida'||a.status==='revisada',aid:a.id})),
    ...rh.map(r=>{const a=DB.aulas.find(x=>x.id===r.aulaId);return{id:'r-'+r.id,lbl:`Revisar: ${a?a.titulo:'aula'}`,tp:'revisao',done:false,rid:r.id};}),
    ...tu.map(t2=>({id:'t-'+t2.id,lbl:`Tarefa: ${t2.titulo}`,tp:'tarefa',done:t2.status==='concluida',tid:t2.id})),
    ...mh.slice(0,2).map(m=>({id:'m-'+m.id,lbl:`Ler: ${m.titulo}`,tp:'material',done:m.statusLeitura==='lido'})),
    ...ph.slice(0,3).map(p=>({id:'p-'+p.id,lbl:`Estudar: ${p.materia}${p.topico?' — '+p.topico:''}`,tp:'plano',done:false,pid:p.id})),
  ];
  const conc=itens.filter(i=>i.done).length;
  const pct=itens.length>0?Math.round((conc/itens.length)*100):100;
  return`
  <div style="max-width:620px;margin:0 auto">
    <div class="card" style="padding:18px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
        <div><div style="font-size:17px;font-weight:700">Rotina de ${diaSem(t)}, ${fmtD(t)}</div><div style="font-size:12.5px;color:var(--tx2)">${conc} de ${itens.length} itens concluídos</div></div>
        <div style="font-size:26px;font-weight:700;color:var(--ac);font-family:'DM Serif Display',serif">${pct}%</div>
      </div>
      <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    </div>
    ${itens.length===0?`<div class="card" style="padding:28px;text-align:center;color:var(--tx3)"><i class="fa-solid fa-sun" style="font-size:32px;margin-bottom:8px;display:block;color:var(--yw)"></i><p>Nada programado para hoje. Descanse ou use o tempo para revisões!</p></div>`:''}
    ${itens.map(it=>`<div class="ck-item ${it.done?'done':''}" onclick="toggleCk('${it.id}','${it.rid||''}','${it.tid||''}','${it.pid||''}','${it.aid||''}')"><div class="ck-box">${it.done?'<i class="fa-solid fa-check" style="color:#fff;font-size:9px"></i>':''}</div><span class="ck-lbl">${esc(it.lbl)}</span><span class="badge ${({aula:'b-blue',revisao:'b-yellow',tarefa:'b-red',material:'b-gray',plano:'b-teal'}[it.tp]||'b-gray')}">${it.tp}</span></div>`).join('')}
    <div class="card" style="padding:14px 16px;margin-top:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:7px">📝 Anotação rápida do dia</div>
      <textarea class="nota-editor" id="rotNota" placeholder="Anote algo importante do dia...">${esc(DB.rotinaNota||'')}</textarea>
      <button class="btn btn-primary btn-sm" style="margin-top:7px" onclick="saveRotNota()">Salvar anotação</button>
    </div>
    ${pct===100&&itens.length>0?`<div class="card" style="padding:20px;margin-top:14px;text-align:center;background:var(--gnb);border-color:var(--gn)"><div style="font-size:30px">🎉</div><div style="font-size:15px;font-weight:700;color:var(--gn);margin-top:6px">Parabéns! Dia concluído!</div><div style="font-size:12.5px;color:var(--tx2)">Você completou todos os itens de hoje.</div></div>`:''}
  </div>`;
}
function toggleCk(id,rid,tid,pid,aid){
  if(rid){
    // Toggle revisão: pendente ↔ concluida
    doneRev(rid);
  } else if(tid){
    // Toggle tarefa: pendente ↔ concluida
    toggleT(tid);
  } else if(pid){
    // Toggle plano: pendente ↔ concluido
    togglePl(pid);
  } else if(aid){
    // Toggle aula: assistida ↔ nao-assistida
    setAS(aid,'assistida');
  } else {
    go('rotina');
  }
}
function toggleChecklist(id,rid,tid,pid,aid){toggleCk(id,rid,tid,pid,aid);}
function saveRotNota(){DB.rotinaNota=document.getElementById('rotNota').value;saveDB();alert('Anotação salva!');}

// ── FORMATAÇÃO DE HORÁRIO COM TIMEZONE (America/Sao_Paulo) ────
function formatarHorarioGoogle(dateTime) {
  if (!dateTime) return '';
  return new Date(dateTime).toLocaleTimeString('pt-BR', {
    hour: '2-digit',
    minute: '2-digit',
    timeZone: 'America/Sao_Paulo'
  });
}
function formatarDataGoogle(dateTime) {
  if (!dateTime) return '';
  return new Date(dateTime).toLocaleDateString('pt-BR', {
    timeZone: 'America/Sao_Paulo'
  });
}
function formatarDataISOGoogle(dateTime) {
  // Retorna YYYY-MM-DD no fuso de São Paulo
  if (!dateTime) return '';
  const d = new Date(dateTime);
  const sp = new Date(d.toLocaleString('en-CA', { timeZone: 'America/Sao_Paulo' }));
  // toLocaleString en-CA devolve YYYY-MM-DD
  return d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
}

// ── CLASSROOM FUNCTIONS (estrutura real) ──────────────────────
async function autenticarGoogle(){
  const cid=localStorage.getItem('mf_gcid');
  if(!cid){alert('Configure o Google Client ID primeiro.');return;}
  try{
    await new Promise((res,rej)=>{if(window.google){res();return;}const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar Google Identity'));document.head.appendChild(s);});
    window._tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:cid,
      scope:'https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.courseworkmaterials.readonly https://www.googleapis.com/auth/classroom.coursework.me.readonly https://www.googleapis.com/auth/drive.readonly',
      callback:async(resp)=>{
        if(resp.error){alert('Erro OAuth: '+resp.error);return;}
        window._gToken=resp.access_token;
        DB.classroomOk=true;saveDB();
        alert('Autenticado! Importando materiais...');
        await importarMateriaisClassroom();
        go('classroom');
      }
    });
    window._tokenClient.requestAccessToken();
  }catch(e){alert('Erro: '+e.message+'\n\nVerifique o Client ID e as APIs ativadas.');}
}
async function listarCursosClassroom(){
  const r=await fetch('https://classroom.googleapis.com/v1/courses?courseStates=ACTIVE',{headers:{Authorization:'Bearer '+window._gToken}});
  const d=await r.json();return d.courses||[];
}
async function listarMateriaisDoCurso(courseId){
  const tk=window._gToken;
  const[mat,work]=await Promise.all([
    fetch(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWorkMaterials`,{headers:{Authorization:'Bearer '+tk}}).then(r=>r.json()),
    fetch(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork`,{headers:{Authorization:'Bearer '+tk}}).then(r=>r.json()),
  ]);
  return[...(mat.courseWorkMaterial||[]),...(work.courseWork||[])];
}
async function listarAtividadesDoCurso(courseId){
  const r=await fetch(`https://classroom.googleapis.com/v1/courses/${courseId}/courseWork`,{headers:{Authorization:'Bearer '+window._gToken}});
  const d=await r.json();return d.courseWork||[];
}
async function importarMateriaisClassroom(){
  const cursos=await listarCursosClassroom();
  let n=0;
  for(const c of cursos){
    const its=await listarMateriaisDoCurso(c.id);
    for(const it of its){
      const titulo=normalizarTituloMaterial(it.title||'Material sem título');
      const links=(it.materials||[]).filter(m=>m.link||m.driveFile||m.youtubeVideo);
      const link=links.length>0?(links[0].link?.url||links[0].driveFile?.driveFile?.alternateLink||''):'';
      // prazoLeitura: usar timezone São Paulo se vier dateTime
      const prazoRaw = it.dueDate
        ? `${it.dueDate.year}-${String(it.dueDate.month).padStart(2,'0')}-${String(it.dueDate.day).padStart(2,'0')}`
        : (it.scheduledTime ? formatarDataISOGoogle(it.scheduledTime) : '');
      DB.materiais.push({id:uid(),titulo,tituloNormalizado:normalizarTituloMaterial(titulo),materia:c.name,modulo:it.topicId||'',tipo:link.includes('youtube')?'vídeo':link.includes('drive')?'PDF':'link',origem:'Google Classroom',link,statusLeitura:'nao-lido',prioridade:'media',dataImportacao:today(),prazoLeitura:prazoRaw,tags:'classroom'});
      n++;
    }
  }
  DB.materiais=removerMateriaisDuplicados(DB.materiais);
  saveDB();alert(`${n} materiais importados e deduplicados!`);
}
// ── BOTÕES DE SINCRONIZAÇÃO ───────────────────────────────────
function clsLog(msg, append){
  const el = document.getElementById('cls-log');
  if (!el) return;
  el.style.display = 'block';
  if (append) el.innerHTML += msg + '<br>';
  else el.innerHTML = msg + '<br>';
  el.scrollTop = el.scrollHeight;
}
function checkAuth(){
  if (!DB.classroomOk || !window._gToken) {
    alert('Conecte sua conta Google primeiro. Clique em "Conectar".');
    return false;
  }
  return true;
}

async function btnListarTurmas(){
  if (!checkAuth()) return;
  clsLog('🔍 Buscando turmas...');
  try {
    const cursos = await listarCursosClassroom();
    DB._turmasClassroom = cursos;
    saveDB();
    if (cursos.length === 0) { clsLog('⚠️ Nenhuma turma ativa encontrada.'); return; }
    clsLog(`✅ ${cursos.length} turma(s) encontrada(s):`);
    cursos.forEach(c => clsLog(`&nbsp;&nbsp;• ${esc(c.name)} (ID: ${c.id})`, true));
    go('classroom');
  } catch(e) {
    clsLog('❌ Erro: ' + e.message);
  }
}

async function btnImportarMateriais(){
  if (!checkAuth()) return;
  clsLog('📦 Importando materiais de todas as turmas...');
  try {
    const cursos = await listarCursosClassroom();
    let total = 0;
    for (const c of cursos) {
      clsLog(`  → Buscando: ${esc(c.name)}`, true);
      const its = await listarMateriaisDoCurso(c.id);
      for (const it of its) {
        const titulo = normalizarTituloMaterial(it.title || 'Material sem título');
        const links = (it.materials || []).filter(m => m.link || m.driveFile || m.youtubeVideo);
        const link = links.length > 0 ? (links[0].link?.url || links[0].driveFile?.driveFile?.alternateLink || '') : '';
        DB.materiais.push({
          id: uid(), titulo, tituloNormalizado: normalizarTituloMaterial(titulo),
          materia: c.name, modulo: it.topicId || '',
          tipo: link.includes('youtube') ? 'vídeo' : link.includes('drive') ? 'PDF' : 'link',
          origem: 'Google Classroom', link, statusLeitura: 'nao-lido',
          prioridade: 'media', dataImportacao: today(), tags: 'classroom',
        });
        total++;
      }
    }
    DB.materiais = removerMateriaisDuplicados(DB.materiais);
    saveDB();
    clsLog(`✅ ${total} material(is) importado(s) e deduplicados. Veja na Biblioteca!`, true);
  } catch(e) {
    clsLog('❌ Erro: ' + e.message, true);
  }
}

async function btnImportarAtividades(){
  if (!checkAuth()) return;
  clsLog('📋 Importando atividades/tarefas de todas as turmas...');
  try {
    const cursos = await listarCursosClassroom();
    let total = 0;
    for (const c of cursos) {
      clsLog(`  → Buscando atividades: ${esc(c.name)}`, true);
      const ativs = await listarAtividadesDoCurso(c.id);
      for (const at of ativs) {
        const titulo = normalizarTituloMaterial(at.title || 'Atividade sem título');
      // Prazo: usar dueDate (já vem como data local do Google) ou scheduledTime com tz correto
        const prazo = at.dueDate
          ? `${at.dueDate.year}-${String(at.dueDate.month).padStart(2,'0')}-${String(at.dueDate.day).padStart(2,'0')}`
          : (at.scheduledTime ? formatarDataISOGoogle(at.scheduledTime) : '');
        // Evitar duplicatas por título + matéria
        const jaExiste = DB.tarefas.find(t =>
          t.titulo === titulo && t.materia === c.name
        );
        if (!jaExiste) {
          DB.tarefas.push({
            id: uid(), titulo,
            descricao: at.description || '',
            materia: c.name,
            categoria: 'material do Classroom',
            prioridade: prazo && diasAte(prazo) <= 7 ? 'alta' : 'media',
            prazo, status: 'pendente',
          });
          total++;
        }
      }
    }
    saveDB();
    clsLog(`✅ ${total} atividade(s) importada(s) para Tarefas!`, true);
  } catch(e) {
    clsLog('❌ Erro: ' + e.message, true);
  }
}

async function btnSincronizarTudo(){
  if (!checkAuth()) return;
  clsLog('🔄 Sincronizando tudo...');
  await btnImportarMateriais();
  await btnImportarAtividades();
  clsLog('🎉 Sincronização completa! Veja Biblioteca e Tarefas.', true);
}

async function btnImportarPorTurma(courseId, courseName){
  if (!checkAuth()) return;
  clsLog(`📦 Importando da turma: ${esc(courseName)}...`);
  try {
    const its = await listarMateriaisDoCurso(courseId);
    const ativs = await listarAtividadesDoCurso(courseId);
    let nm = 0, na = 0;
    for (const it of its) {
      const titulo = normalizarTituloMaterial(it.title || 'Material');
      const links = (it.materials || []).filter(m => m.link || m.driveFile || m.youtubeVideo);
      const link = links.length > 0 ? (links[0].link?.url || links[0].driveFile?.driveFile?.alternateLink || '') : '';
      DB.materiais.push({id:uid(),titulo,tituloNormalizado:normalizarTituloMaterial(titulo),materia:courseName,modulo:it.topicId||'',tipo:link.includes('youtube')?'vídeo':link.includes('drive')?'PDF':'link',origem:'Google Classroom',link,statusLeitura:'nao-lido',prioridade:'media',dataImportacao:today(),tags:'classroom'});
      nm++;
    }
    for (const at of ativs) {
      const titulo = normalizarTituloMaterial(at.title || 'Atividade');
      const prazo = at.dueDate ? `${at.dueDate.year}-${String(at.dueDate.month).padStart(2,'0')}-${String(at.dueDate.day).padStart(2,'0')}` : '';
      if (!DB.tarefas.find(t => t.titulo === titulo && t.materia === courseName)) {
        DB.tarefas.push({id:uid(),titulo,descricao:at.description||'',materia:courseName,categoria:'material do Classroom',prioridade:prazo&&diasAte(prazo)<=7?'alta':'media',prazo,status:'pendente'});
        na++;
      }
    }
    DB.materiais = removerMateriaisDuplicados(DB.materiais);
    saveDB();
    clsLog(`✅ ${nm} material(is) e ${na} atividade(s) importados de "${esc(courseName)}"!`, true);
  } catch(e) {
    clsLog('❌ Erro: ' + e.message, true);
  }
}

function importJSON(){
  try{
    const arr=JSON.parse(document.getElementById('jsonIn').value.trim());
    if(!Array.isArray(arr)){alert('Use um array JSON: [...]');return;}
    arr.forEach(it=>{if(!it.titulo)return;DB.materiais.push({id:uid(),titulo:it.titulo,tituloNormalizado:normalizarTituloMaterial(it.titulo),materia:it.materia||'',modulo:it.modulo||'',tipo:it.tipo||'link',origem:'manual',link:it.link||'',statusLeitura:'nao-lido',prioridade:it.prioridade||'media',tags:it.tags||'',dataImportacao:today()});});
    DB.materiais=removerMateriaisDuplicados(DB.materiais);
    saveDB();alert('Importado!');go('biblioteca');
  }catch(e){alert('JSON inválido: '+e.message);}
}

function doSearch(){
  const q=document.getElementById('gSearch').value.toLowerCase().trim();
  if(!q)return;
  const res=[
    ...DB.aulas.filter(a=>a.titulo.toLowerCase().includes(q)).map(a=>({tp:'Aula',ttl:a.titulo,pg:'aulas'})),
    ...DB.provas.filter(p=>p.titulo.toLowerCase().includes(q)).map(p=>({tp:'Prova',ttl:p.titulo,pg:'provas'})),
    ...DB.tarefas.filter(t=>t.titulo.toLowerCase().includes(q)).map(t=>({tp:'Tarefa',ttl:t.titulo,pg:'tarefas'})),
    ...DB.materiais.filter(m=>m.titulo.toLowerCase().includes(q)).map(m=>({tp:'Material',ttl:m.titulo,pg:'biblioteca'})),
    ...DB.anotacoes.filter(n=>(n.titulo+n.conteudo).toLowerCase().includes(q)).map(n=>({tp:'Nota',ttl:n.titulo,pg:'anotacoes'})),
  ].slice(0,9);
  if(res.length===0){openModal('Busca',`<div style="text-align:center;color:var(--tx3);padding:20px">Nenhum resultado para "<strong>${esc(q)}</strong>"</div>`,`<button class="btn btn-secondary" onclick="closeModal()">Fechar</button>`);return;}
  openModal(`Resultados para "${esc(q)}"`,res.map(r=>`<div class="li"><span class="badge b-blue">${r.tp}</span><span style="flex:1;margin-left:8px;font-size:13px">${esc(r.ttl)}</span><button class="btn btn-xs btn-secondary" onclick="go('${r.pg}');closeModal()">Ver</button></div>`).join(''),`<button class="btn btn-secondary" onclick="closeModal()">Fechar</button>`);
}
